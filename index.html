<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Flybench</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#e9e7dd" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#102a4c" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Fly patterns to tie, step by step, in 3D." />
    <script>
      // The theme before the first paint, so a dark page doesn't flash light while the app loads
      // (src/ui/theme.ts takes over from here).
      try {
        var t = localStorage.getItem("flybench.theme");
        document.documentElement.dataset.theme =
          t === "light" || t === "dark" ? t : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
